name: Go checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - run: go test -race -cover -timeout=60s ./...
      - run: go vet ./...
      - run: go test -race -timeout=30s ./...
        working-directory: test/client
      - run: go build -o /tmp/nets-server ./...
        working-directory: test/server
      - run: go build -o /tmp/nets-client ./...
        working-directory: test/client
